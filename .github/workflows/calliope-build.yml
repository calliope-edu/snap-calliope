name: calliope-build

# Builds Snap! with the Calliope mini library and pushes it to a build branch,
# one commit per build, in two places:
#
#   /                the site on its own address (snap.calliope.cc)
#   /editors/snap/   the same build at the path Calliope Campus serves its
#                    editors under, on its own origin (calliope-campus
#                    docs/editors.md)
#
# The pages only use relative paths, so both are the same files; the build runs
# once and is copied. Which branch:
#
#   tag calliope-vX.Y.Z      → build-live  (snap.calliope.cc)
#   push to calliope-main    → build-dev   (snap-dev.calliope.cc)
#
# Each build branch is ready to serve as it is: a Cloudflare Pages project on it
# needs no build command and the repository root as its output directory. Each
# commit carries BUILD.json (at the root and in editors/snap/; format in
# docs/build-info.md) naming channel, version and source commit; the build
# compiles the same values into build-info.js for the version line in the
# Snap! logo menu.
#
# The build branches only ever grow: Campus may pin their older commits, so
# rewriting them would break those builds.

on:
  push:
    branches:
      - calliope-main
    tags:
      - calliope-v*
  workflow_dispatch:

# One build after the other per build branch, so every build lands in order.
concurrency:
  group: calliope-build-${{ github.ref_type }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The Snap! release (~130 MB) is downloaded once per snapVersion.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: snap-release-${{ hashFiles('package.json') }}
          restore-keys: snap-release-

      # One set of build values for BUILD.json and build-info.js
      # (scripts/build-info.mjs).
      - name: Build info
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          channel=dev
          if [ "$REF_TYPE" = tag ]; then channel=live; fi
          {
            echo "BUILD_CHANNEL=$channel"
            echo "BUILD_VERSION=$REF_NAME"
            echo "BUILD_COMMIT=$SHA"
            echo "BUILD_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"

      # No dependencies to install: the build is plain Node.
      - name: Build
        run: npm run build

      - name: Push the build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          name=snap
          target=build-dev
          if [ "$REF_TYPE" = tag ]; then target=build-live; fi
          short=${SOURCE_SHA:0:7}
          out="$RUNNER_TEMP/out"
          mkdir -p "$out/editors/$name"
          cp -r dist/. "$out/"
          cp -r dist/. "$out/editors/$name/"
          cat "$out/BUILD.json"
          mkdir publish && cd publish
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git fetch -q --depth 1 origin "$target"; then
            git checkout -q -b "$target" FETCH_HEAD
          else
            git checkout -q --orphan "$target"
          fi
          git rm -rqf --ignore-unmatch .
          cp -r "$out/." .
          # Build output, kept byte for byte: no line-ending conversion on checkout.
          printf '# Build output, kept byte for byte (no line-ending conversion on checkout).\n* -text\n' > .gitattributes
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "build ${short} from ${SOURCE_REF}" -m "Source: https://github.com/${REPO}/commit/${SOURCE_SHA}"
          git push -q origin "$target"
          echo "### ${target}: build ${short} from ${SOURCE_REF}" >> "$GITHUB_STEP_SUMMARY"
